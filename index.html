<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NXP 中班吃吃喝喝</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="吃吃喝喝" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #111114;
      --bg2: #1a1a1e;
      --bg3: #222228;
      --border: rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.18);
      --text: #dcdce0;
      --text2: #8a8a94;
      --text3: #52525c;
      --accent-drink: #7c9ea6;
      --accent-food: #8a8fa8;
      --paid: #6b8f71;
      --unpaid: #a07850;
      --skip: #5a5a6e;
      --absent: #3a3a40;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); }
    body { font-family: 'Noto Sans TC', sans-serif; color: var(--text); font-weight: 300; letter-spacing: 0.02em; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; font-weight: 300; letter-spacing: 0.03em; }
    input { font-family: inherit; font-weight: 300; }
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .day-chip {
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 12px; font-weight: 400;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .2s;
      border: 1px solid var(--border);
      color: var(--text2);
      background: var(--bg2);
    }
    .day-chip:active { transform: scale(0.88); }
    .inp {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      font-weight: 300;
      letter-spacing: 0.02em;
    }
    .inp::placeholder { color: var(--text3); }
    .inp:focus { outline: none; border-color: var(--border2); }
    button:active { opacity: 0.7; }
    .label { font-size: 11px; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const DAYS = ["一","二","三","四","五","六","日"];
const defaultPeople = [
  { id: 1, name: "小明", workDays: [0,1,2,3,4] },
  { id: 2, name: "小美", workDays: [0,1,2,3,4] },
];
function randomId() { return Math.random().toString(36).slice(2,9); }

const STATUS_CYCLE = { unpaid: "paid", paid: "skip", skip: "unpaid" };

const STATUS = {
  paid:   { label:"已付", color:"#6b8f71", bg:"rgba(107,143,113,0.12)", border:"rgba(107,143,113,0.35)" },
  unpaid: { label:"未付", color:"#a07850", bg:"rgba(160,120,80,0.12)",  border:"rgba(160,120,80,0.35)" },
  skip:   { label:"不點", color:"#5a5a72", bg:"rgba(90,90,114,0.12)",   border:"rgba(90,90,114,0.35)" },
  absent: { label:"休假", color:"#3a3a44", bg:"rgba(58,58,68,0.12)",    border:"rgba(58,58,68,0.4)" },
};

function App() {
  const [people, setPeople] = useState(() => {
    try { const s = localStorage.getItem("nxp_people"); return s ? JSON.parse(s) : defaultPeople; } catch { return defaultPeople; }
  });
  const [rounds, setRounds] = useState(() => {
    try { const s = localStorage.getItem("nxp_rounds"); return s ? JSON.parse(s) : []; } catch { return []; }
  });
  const [view, setView] = useState("home");
  const [activeRound, setActiveRound] = useState(null);
  const [editPerson, setEditPerson] = useState(null);
  const [newName, setNewName] = useState("");
  const [newWorkDays, setNewWorkDays] = useState([0,1,2,3,4]);
  const [toast, setToast] = useState("");
  const [showAddPerson, setShowAddPerson] = useState(false);
  const [imgZoom, setImgZoom] = useState(null);
  const fileRef = useRef();

  useEffect(() => { try { localStorage.setItem("nxp_people", JSON.stringify(people)); } catch(e) {} }, [people]);
  useEffect(() => { try { localStorage.setItem("nxp_rounds", JSON.stringify(rounds)); } catch(e) {} }, [rounds]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 1800); }
  function todayIdx() { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; }

  function makeRound(type) {
    const today = todayIdx();
    const present = people.filter(p => p.workDays.includes(today));
    return {
      id: randomId(), type,
      date: new Date().toLocaleDateString("zh-TW"),
      dayLabel: "週" + DAYS[today],
      image: null, shopName: "",
      orders: Object.fromEntries(people.map(p => [p.id, { item: "", amount: "" }])),
      payments: Object.fromEntries(people.map(p => [p.id, present.some(x => x.id === p.id) ? "unpaid" : "absent"])),
    };
  }

  function startRound(type) { setActiveRound(makeRound(type)); setView("newRound"); }

  function handleImageUpload(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setActiveRound(r => ({ ...r, image: ev.target.result }));
    reader.readAsDataURL(file);
  }

  function updateOrder(pid, field, val) {
    setActiveRound(r => ({ ...r, orders: { ...r.orders, [pid]: { ...r.orders[pid], [field]: val } } }));
  }

  function cycleStatus(pid) {
    setActiveRound(r => {
      const cur = r.payments[pid];
      if (cur === "absent") return r;
      return { ...r, payments: { ...r.payments, [pid]: STATUS_CYCLE[cur] || "unpaid" } };
    });
  }

  function toggleAbsent(pid) {
    setActiveRound(r => {
      const cur = r.payments[pid];
      return { ...r, payments: { ...r.payments, [pid]: cur === "absent" ? "unpaid" : "absent" } };
    });
  }

  function saveRound() {
    // compress image if too large
    let round = activeRound;
    if (round.image && round.image.length > 300000) {
      const canvas = document.createElement("canvas");
      const img = new Image();
      img.src = round.image;
      canvas.width = 800;
      canvas.height = Math.round(img.height * (800 / img.width));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      round = { ...round, image: canvas.toDataURL("image/jpeg", 0.5) };
    }
    setRounds(rs => [round, ...rs]);
    showToast("已儲存");
    setView("home");
    setActiveRound(null);
  }
  function openRound(round) { setActiveRound(round); setView("roundDetail"); }

  function cycleRoundPayment(pid) {
    setActiveRound(r => {
      const cur = r.payments[pid];
      if (cur === "absent") return r;
      const updated = { ...r, payments: { ...r.payments, [pid]: STATUS_CYCLE[cur] || "unpaid" } };
      setRounds(rs => rs.map(x => x.id === updated.id ? updated : x));
      return updated;
    });
  }

  function deleteRound(id) { setRounds(rs => rs.filter(r => r.id !== id)); setView("home"); setActiveRound(null); showToast("已刪除"); }

  function addPerson() {
    if (!newName.trim()) return;
    setPeople(ps => [...ps, { id: Date.now(), name: newName.trim(), workDays: newWorkDays }]);
    setNewName(""); setNewWorkDays([0,1,2,3,4]); setShowAddPerson(false); showToast("已新增");
  }
  function savePerson() { setPeople(ps => ps.map(p => p.id === editPerson.id ? editPerson : p)); setEditPerson(null); showToast("已更新"); }
  function deletePerson(id) { setPeople(ps => ps.filter(p => p.id !== id)); setEditPerson(null); showToast("已刪除"); }

  const unpaidCounts = {};
  people.forEach(p => { unpaidCounts[p.id] = 0; });
  rounds.forEach(r => { Object.entries(r.payments).forEach(([pid, s]) => { if (s === "unpaid") unpaidCounts[pid] = (unpaidCounts[pid] || 0) + 1; }); });

  function roundTotal(round) {
    if (!round.orders) return 0;
    return Object.entries(round.orders).reduce((sum, [pid, o]) => {
      const s = round.payments[pid];
      if (s === "absent" || s === "skip") return sum;
      return sum + (parseFloat(o.amount) || 0);
    }, 0);
  }

  const typeEmoji = t => t === "drink" ? "🧋" : "🍱";
  const typeLabel = t => t === "drink" ? "飲料" : "食物";
  const typePlaceholder = t => t === "drink" ? "品項" : "品項";
  const typeShopPlaceholder = t => t === "drink" ? "例：50嵐、茶湯會" : "例：便當店、麥當勞";

  const divider = <div style={{ height:1, background:"var(--border)", margin:"0 0 10px" }} />;

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg)", paddingBottom:90 }}>

      {/* Toast */}
      {toast && (
        <div style={{ position:"fixed", top:24, left:"50%", transform:"translateX(-50%)", background:"var(--bg3)", border:"1px solid var(--border2)", padding:"9px 22px", borderRadius:999, fontSize:13, zIndex:999, whiteSpace:"nowrap", color:"var(--text)", letterSpacing:"0.05em" }}>
          {toast}
        </div>
      )}

      {/* Image zoom */}
      {imgZoom && (
        <div onClick={() => setImgZoom(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <img src={imgZoom} style={{ maxWidth:"100%", maxHeight:"90vh", borderRadius:8 }} />
        </div>
      )}

      {/* ── HOME ── */}
      {view === "home" && (
        <div style={{ padding:"0 18px" }}>
          <div style={{ paddingTop:58, paddingBottom:28 }}>
            
            <h1 style={{ fontSize:28, lineHeight:1.3, letterSpacing:"0.03em", fontFamily:"'Zen Maru Gothic', sans-serif" }}><span style={{ color:"#F5A800", fontWeight:700, fontSize:30 }}>N</span><span style={{ color:"#00A6D6", fontWeight:700, fontSize:30 }}>X</span><span style={{ color:"#7AB800", fontWeight:700, fontSize:30 }}>P</span><span style={{ color:"var(--text)", fontWeight:300, letterSpacing:"0.06em" }}> 中班吃吃喝喝</span></h1>
          </div>

          {/* Unpaid summary */}
          {people.some(p => unpaidCounts[p.id] > 0) && (
            <div className="card" style={{ padding:"14px 16px", marginBottom:20 }}>
              <div className="label">待收款</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                {people.filter(p => unpaidCounts[p.id] > 0).map(p => (
                  <div key={p.id} style={{ background:"rgba(160,120,80,0.1)", border:"1px solid rgba(160,120,80,0.25)", borderRadius:6, padding:"3px 10px", fontSize:13, color:"#a07850" }}>
                    {p.name} <span style={{ opacity:0.7 }}>×{unpaidCounts[p.id]}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* New round buttons */}
          <div style={{ display:"flex", gap:10, marginBottom:28 }}>
            <button onClick={() => startRound("drink")} style={{
              flex:1, padding:"15px 0",
              background:"var(--bg3)",
              border:"1px solid rgba(124,158,166,0.3)",
              color:"#7c9ea6", fontSize:14, fontWeight:400,
              borderRadius:10, letterSpacing:"0.05em",
              boxShadow:"inset 0 1px 0 rgba(255,255,255,0.04)",
            }}>🧋 飲料單</button>
            <button onClick={() => startRound("food")} style={{
              flex:1, padding:"15px 0",
              background:"var(--bg3)",
              border:"1px solid rgba(138,143,168,0.3)",
              color:"#8a8fa8", fontSize:14, fontWeight:400,
              borderRadius:10, letterSpacing:"0.05em",
              boxShadow:"inset 0 1px 0 rgba(255,255,255,0.04)",
            }}>🍱 食物單</button>
          </div>

          {/* History */}
          <div className="label" style={{ marginBottom:14 }}>紀錄</div>
          {rounds.length === 0 && (
            <div style={{ textAlign:"center", color:"var(--text3)", fontSize:13, padding:"40px 0", letterSpacing:"0.05em" }}>尚無紀錄</div>
          )}
          {rounds.map(r => {
            const unpaid = Object.values(r.payments).filter(s => s === "unpaid").length;
            const paid = Object.values(r.payments).filter(s => s === "paid").length;
            const total = roundTotal(r);
            const accentColor = r.type === "drink" ? "#7c9ea6" : "#8a8fa8";
            return (
              <div key={r.id} className="card" onClick={() => openRound(r)} style={{ padding:"14px 16px", marginBottom:8, cursor:"pointer", display:"flex", gap:12, alignItems:"center" }}>
                {r.image ? (
                  <img src={r.image} onClick={e=>{e.stopPropagation();setImgZoom(r.image)}} style={{ width:46, height:46, objectFit:"cover", borderRadius:8, flexShrink:0, opacity:0.85 }} />
                ) : (
                  <div style={{ width:46, height:46, borderRadius:8, background:"var(--bg2)", border:"1px solid var(--border)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>{typeEmoji(r.type)}</div>
                )}
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:400, color:"var(--text)", display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:10, color:accentColor, letterSpacing:"0.1em", textTransform:"uppercase" }}>{typeLabel(r.type)}</span>
                    <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.shopName || r.date}</span>
                  </div>
                  <div style={{ fontSize:11, color:"var(--text2)", marginTop:4, letterSpacing:"0.03em" }}>
                    {r.shopName && <span style={{ marginRight:8, color:"var(--text3)" }}>{r.date} {r.dayLabel}</span>}
                    {!r.shopName && <span style={{ marginRight:8, color:"var(--text3)" }}>{r.dayLabel}</span>}
                    已付 {paid} · 未付 <span style={{ color:"#a07850" }}>{unpaid}</span>
                    {total > 0 && <span style={{ color:"var(--text2)", marginLeft:8 }}>$ {total}</span>}
                  </div>
                </div>
                <div style={{ fontSize:16, color:"var(--text3)" }}>›</div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── NEW ROUND ── */}
      {view === "newRound" && activeRound && (
        <div style={{ padding:"0 18px" }}>
          <div style={{ height:130 }} />
          <div style={{ position:"fixed", top:0, left:0, right:0, zIndex:50, background:"var(--bg)", borderBottom:"1px solid var(--border)", paddingTop:"calc(env(safe-area-inset-top, 0px) + 14px)", paddingBottom:"14px", paddingLeft:"18px", paddingRight:"18px", display:"flex", alignItems:"center", gap:14 }}>
            <button onClick={() => setView("home")} style={{ background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:999, width:34, height:34, color:"var(--text2)", fontSize:16, flexShrink:0 }}>‹</button>
            <div>
              <div style={{ fontSize:11, color:"var(--text3)", letterSpacing:"0.05em" }}>{activeRound.date} {activeRound.dayLabel}</div>
              <h2 style={{ fontSize:18, fontWeight:400, color:"var(--text)", letterSpacing:"0.03em" }}>{typeEmoji(activeRound.type)} {typeLabel(activeRound.type)}單</h2>
            </div>
          </div>

          {/* Shop name */}
          <div className="card" style={{ padding:"14px 16px", marginBottom:12, marginTop:8 }}>
            <div className="label">店名（選填）</div>
            <input className="inp" placeholder={typeShopPlaceholder(activeRound.type)} value={activeRound.shopName} onChange={e => setActiveRound(r => ({...r, shopName:e.target.value}))} />
          </div>

          {/* Image */}
          <div className="card" style={{ padding:"14px 16px", marginBottom:12 }}>
            <div className="label">訂單截圖（選填）</div>
            {activeRound.image ? (
              <div style={{ position:"relative" }}>
                <img src={activeRound.image} onClick={() => setImgZoom(activeRound.image)} style={{ width:"100%", maxHeight:160, objectFit:"cover", borderRadius:8, cursor:"pointer", opacity:0.9 }} />
                <button onClick={() => setActiveRound(r => ({...r, image:null}))} style={{ position:"absolute", top:8, right:8, background:"rgba(0,0,0,0.7)", color:"var(--text2)", borderRadius:999, width:26, height:26, fontSize:13, border:"1px solid var(--border)" }}>✕</button>
              </div>
            ) : (
              <button onClick={() => fileRef.current.click()} style={{ width:"100%", padding:12, background:"var(--bg2)", border:"1px dashed var(--border2)", borderRadius:8, color:"var(--text3)", fontSize:13, letterSpacing:"0.05em" }}>
                ＋ 上傳圖片
              </button>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleImageUpload} />
          </div>

          {/* Per-person */}
          <div style={{ fontSize:11, color:"var(--text3)", letterSpacing:"0.05em", marginBottom:10, marginTop:4 }}>
            點狀態循環切換：未付 → 已付 → 不點
          </div>
          {people.map(p => {
            const status = activeRound.payments[p.id] || "absent";
            const order = activeRound.orders?.[p.id] || { item:"", amount:"" };
            const st = STATUS[status];
            return (
              <div key={p.id} className="card" style={{ padding:"14px 16px", marginBottom:8 }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: (status==="absent"||status==="skip") ? 0 : 10 }}>
                  <div>
                    <div style={{ fontWeight:400, fontSize:15, color:"var(--text)" }}>{p.name}</div>
                    <div style={{ fontSize:11, color:"var(--text3)", marginTop:2, letterSpacing:"0.03em" }}>{p.workDays.map(d => DAYS[d]).join(" · ")}</div>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button onClick={() => toggleAbsent(p.id)} style={{
                      background: status==="absent" ? "rgba(58,58,68,0.3)" : "transparent",
                      border:`1px solid ${status==="absent" ? "rgba(58,58,68,0.8)" : "var(--border)"}`,
                      borderRadius:7, padding:"5px 11px", fontSize:12,
                      color: status==="absent" ? "#5a5a6e" : "var(--text3)",
                      letterSpacing:"0.03em",
                    }}>休假</button>
                    <button onClick={() => cycleStatus(p.id)} style={{
                      width:72, height:32, borderRadius:7,
                      background: st.bg, border:`1px solid ${st.border}`,
                      color: st.color, fontSize:12, fontWeight:400,
                      opacity: status==="absent" ? 0.3 : 1,
                      letterSpacing:"0.03em",
                    }}>{st.label}</button>
                  </div>
                </div>
                {status !== "absent" && status !== "skip" && (
                  <div style={{ display:"flex", gap:8 }}>
                    <input className="inp" placeholder={typePlaceholder(activeRound.type)} value={order.item} onChange={e => updateOrder(p.id,"item",e.target.value)} style={{ flex:2, padding:"8px 12px", fontSize:13 }} />
                    <input className="inp" placeholder="金額" type="number" value={order.amount} onChange={e => updateOrder(p.id,"amount",e.target.value)} style={{ flex:1, padding:"8px 12px", fontSize:13 }} />
                  </div>
                )}
              </div>
            );
          })}

          {roundTotal(activeRound) > 0 && (
            <div style={{ textAlign:"right", fontSize:13, color:"var(--text2)", marginBottom:12, letterSpacing:"0.05em" }}>
              合計 $ {roundTotal(activeRound)}
            </div>
          )}

          <button onClick={saveRound} style={{
            width:"100%", padding:15, marginBottom:20,
            background:"var(--bg3)",
            border:"1px solid rgba(107,143,113,0.35)",
            color:"#6b8f71", fontSize:14, fontWeight:400,
            borderRadius:10, letterSpacing:"0.08em",
            boxShadow:"inset 0 1px 0 rgba(255,255,255,0.03)",
          }}>儲存紀錄</button>
        </div>
      )}

      {/* ── ROUND DETAIL ── */}
      {view === "roundDetail" && activeRound && (
        <div style={{ padding:"0 18px" }}>
          <div style={{ height:130 }} />
          <div style={{ position:"fixed", top:0, left:0, right:0, zIndex:50, background:"var(--bg)", borderBottom:"1px solid var(--border)", paddingTop:"calc(env(safe-area-inset-top, 0px) + 14px)", paddingBottom:"14px", paddingLeft:"18px", paddingRight:"18px", display:"flex", alignItems:"center", gap:14 }}>
            <button onClick={() => setView("home")} style={{ background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:999, width:34, height:34, color:"var(--text2)", fontSize:16, flexShrink:0 }}>‹</button>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:"var(--text3)", letterSpacing:"0.05em" }}>{activeRound.dayLabel} · {typeLabel(activeRound.type)}</div>
              <h2 style={{ fontSize:18, fontWeight:400, color:"var(--text)" }}>{activeRound.shopName || activeRound.date}</h2>
              {activeRound.shopName && <div style={{ fontSize:11, color:"var(--text3)" }}>{activeRound.date}</div>}
            </div>
            <button onClick={() => deleteRound(activeRound.id)} style={{ background:"transparent", border:"1px solid rgba(120,60,60,0.4)", borderRadius:7, padding:"5px 12px", color:"rgba(180,90,90,0.7)", fontSize:12, letterSpacing:"0.03em" }}>刪除</button>
          </div>

          {activeRound.image && (
            <img src={activeRound.image} onClick={() => setImgZoom(activeRound.image)} style={{ width:"100%", maxHeight:160, objectFit:"cover", borderRadius:10, marginBottom:14, cursor:"pointer", opacity:0.85 }} />
          )}

          <div style={{ fontSize:11, color:"var(--text3)", letterSpacing:"0.05em", marginBottom:10 }}>點一下循環切換狀態</div>
          {people.map(p => {
            const status = activeRound.payments[p.id] || "absent";
            const order = activeRound.orders?.[p.id];
            const st = STATUS[status];
            return (
              <div key={p.id} className="card" onClick={() => cycleRoundPayment(p.id)} style={{ padding:"14px 16px", marginBottom:8, cursor:"pointer" }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontWeight:400, fontSize:15, color:"var(--text)" }}>{p.name}</div>
                    {order && order.item && status !== "skip" && status !== "absent" && (
                      <div style={{ fontSize:12, color:"var(--text2)", marginTop:2, letterSpacing:"0.02em" }}>
                        {order.item}{order.amount ? <span style={{ color:"var(--text3)" }}> · $ {order.amount}</span> : ""}
                      </div>
                    )}
                  </div>
                  <div style={{ padding:"4px 14px", borderRadius:999, background:st.bg, border:`1px solid ${st.border}`, color:st.color, fontSize:12, letterSpacing:"0.05em" }}>
                    {st.label}
                  </div>
                </div>
              </div>
            );
          })}
          {roundTotal(activeRound) > 0 && (
            <div style={{ textAlign:"right", fontSize:13, color:"var(--text2)", marginTop:8, marginBottom:16, letterSpacing:"0.05em" }}>合計 $ {roundTotal(activeRound)}</div>
          )}
        </div>
      )}

      {/* ── MANAGE ── */}
      {view === "manage" && (
        <div style={{ padding:"0 18px" }}>
          <div style={{ height:130 }} />
          <div style={{ position:"fixed", top:0, left:0, right:0, zIndex:50, background:"var(--bg)", borderBottom:"1px solid var(--border)", paddingTop:"calc(env(safe-area-inset-top, 0px) + 14px)", paddingBottom:"14px", paddingLeft:"18px", paddingRight:"18px", display:"flex", alignItems:"center", gap:14 }}>
            <button onClick={() => setView("home")} style={{ background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:999, width:34, height:34, color:"var(--text2)", fontSize:16, flexShrink:0 }}>‹</button>
            <h2 style={{ fontSize:18, fontWeight:400, color:"var(--text)", letterSpacing:"0.03em" }}>同事名單</h2>
          </div>
          {people.map(p => (
            <div key={p.id} className="card" onClick={() => setEditPerson({...p})} style={{ padding:"14px 16px", marginBottom:8, cursor:"pointer" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontWeight:400, fontSize:15, color:"var(--text)" }}>{p.name}</div>
                  <div style={{ fontSize:11, color:"var(--text3)", marginTop:3, letterSpacing:"0.03em" }}>{p.workDays.map(d => "週"+DAYS[d]).join("　")}</div>
                </div>
                <div style={{ color:"var(--text3)", fontSize:16 }}>›</div>
              </div>
            </div>
          ))}
          <button onClick={() => setShowAddPerson(true)} style={{ width:"100%", padding:13, marginTop:8, background:"transparent", border:"1px dashed var(--border2)", color:"var(--text3)", fontSize:13, borderRadius:10, letterSpacing:"0.05em" }}>＋ 新增同事</button>
        </div>
      )}

      {/* Edit Person Modal */}
      {editPerson && (
        <div onClick={() => setEditPerson(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:100, display:"flex", alignItems:"flex-end" }}>
          <div onClick={e => e.stopPropagation()} style={{ width:"100%", background:"var(--bg3)", borderRadius:"16px 16px 0 0", padding:"24px 20px 44px", border:"1px solid var(--border)" }}>
            <div style={{ fontWeight:400, fontSize:16, marginBottom:20, color:"var(--text)", letterSpacing:"0.03em" }}>{editPerson.name}</div>
            <input value={editPerson.name} onChange={e => setEditPerson({...editPerson, name:e.target.value})} className="inp" style={{ marginBottom:16 }} placeholder="姓名" />
            <div className="label">上班日</div>
            <div style={{ display:"flex", gap:8, marginBottom:24 }}>
              {DAYS.map((d,i) => {
                const active = editPerson.workDays.includes(i);
                return <div key={i} className="day-chip" style={{ background:active?"rgba(124,158,166,0.2)":"var(--bg2)", color:active?"#7c9ea6":"var(--text3)", border:active?"1px solid rgba(124,158,166,0.4)":"1px solid var(--border)" }} onClick={() => setEditPerson(ep => ({...ep, workDays:active?ep.workDays.filter(x=>x!==i):[...ep.workDays,i].sort()}))}>{d}</div>;
              })}
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={() => deletePerson(editPerson.id)} style={{ flex:1, padding:13, borderRadius:9, background:"transparent", border:"1px solid rgba(120,60,60,0.35)", color:"rgba(180,90,90,0.7)", fontSize:13 }}>刪除</button>
              <button onClick={savePerson} style={{ flex:2, padding:13, borderRadius:9, background:"var(--bg2)", border:"1px solid rgba(124,158,166,0.3)", color:"#7c9ea6", fontSize:13, letterSpacing:"0.05em" }}>儲存</button>
            </div>
          </div>
        </div>
      )}

      {/* Add Person Modal */}
      {showAddPerson && (
        <div onClick={() => setShowAddPerson(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:100, display:"flex", alignItems:"flex-end" }}>
          <div onClick={e => e.stopPropagation()} style={{ width:"100%", background:"var(--bg3)", borderRadius:"16px 16px 0 0", padding:"24px 20px 44px", border:"1px solid var(--border)" }}>
            <div style={{ fontWeight:400, fontSize:16, marginBottom:20, color:"var(--text)", letterSpacing:"0.03em" }}>新增同事</div>
            <input value={newName} onChange={e => setNewName(e.target.value)} className="inp" style={{ marginBottom:16 }} placeholder="姓名" />
            <div className="label">上班日</div>
            <div style={{ display:"flex", gap:8, marginBottom:24 }}>
              {DAYS.map((d,i) => {
                const active = newWorkDays.includes(i);
                return <div key={i} className="day-chip" style={{ background:active?"rgba(124,158,166,0.2)":"var(--bg2)", color:active?"#7c9ea6":"var(--text3)", border:active?"1px solid rgba(124,158,166,0.4)":"1px solid var(--border)" }} onClick={() => setNewWorkDays(ds => active?ds.filter(x=>x!==i):[...ds,i].sort())}>{d}</div>;
              })}
            </div>
            <button onClick={addPerson} style={{ width:"100%", padding:13, borderRadius:9, background:"var(--bg2)", border:"1px solid rgba(124,158,166,0.3)", color:"#7c9ea6", fontSize:13, letterSpacing:"0.05em" }}>新增</button>
          </div>
        </div>
      )}

      {/* Bottom Nav */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, background:"rgba(17,17,20,0.97)", borderTop:"1px solid var(--border)", display:"flex", backdropFilter:"blur(12px)" }}>
        {[{id:"home",label:"紀錄",icon:"▤"},{id:"manage",label:"同事",icon:"◎"}].map(tab => (
          <button key={tab.id} onClick={() => setView(tab.id)} style={{
            flex:1, padding:"13px 0 18px", background:"none",
            color: view===tab.id ? "#7c9ea6" : "var(--text3)",
            fontSize:9, fontWeight:400, letterSpacing:"0.12em", textTransform:"uppercase",
            display:"flex", flexDirection:"column", alignItems:"center", gap:4,
            borderTop:`1px solid ${view===tab.id ? "rgba(124,158,166,0.4)" : "transparent"}`,
            transition:"color .2s",
          }}>
            <span style={{ fontSize:18 }}>{tab.icon}</span>
            {tab.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
