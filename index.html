<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>NXP 中班吃吃喝喝</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="吃吃喝喝" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg: #111114;
  --bg2: #1a1a1e;
  --bg3: #222228;
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --text: #dcdce0;
  --text2: #8a8a94;
  --text3: #52525c;
  --safe-top: env(safe-area-inset-top, 44px);
  --header-h: calc(env(safe-area-inset-top, 44px) + 60px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: var(--bg); overflow: hidden; }
body { height: 100%; background: var(--bg); overflow: hidden; position: fixed; inset: 0; width: 100%; font-family: 'Noto Sans TC', sans-serif; color: var(--text); font-weight: 300; letter-spacing: 0.02em; }
#root { height: 100%; }
.scroll-area { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
button { cursor: pointer; border: none; outline: none; font-family: inherit; font-weight: 300; letter-spacing: 0.03em; }
input { font-family: inherit; font-weight: 300; }
.card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; }
.day-chip { width: 32px; height: 32px; border-radius: 50%; font-size: 12px; font-weight: 400; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; border: 1px solid var(--border); color: var(--text2); background: var(--bg2); }
.day-chip:active { transform: scale(0.88); }
.inp { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; font-weight: 300; letter-spacing: 0.02em; }
.inp::placeholder { color: var(--text3); }
.inp:focus { outline: none; border-color: var(--border2); }
button:active { opacity: 0.7; }
.label { font-size: 11px; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding-top: var(--safe-top); display: flex; align-items: center; gap: 14px; padding-left: 18px; padding-right: 18px; padding-bottom: 14px; min-height: var(--header-h); }
.page { padding: 0 18px; padding-top: calc(var(--header-h) + 14px); padding-bottom: 90px; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
var DAYS = ["一","二","三","四","五","六","日"];
var defaultPeople = [
  { id: 1, name: "俊儀", workDays: [0,1,2,3,6] },
  { id: 2, name: "伯儒", workDays: [0,1,2,3,6] },
  { id: 3, name: "捷文", workDays: [1,2,3,4,5] },
  { id: 4, name: "阿竣", workDays: [0,1,2,4,5] },
  { id: 5, name: "儷禎", workDays: [0,1,3,4,5] },
  { id: 6, name: "朝順", workDays: [0,2,3,4,6] },
  { id: 7, name: "哲嘉", workDays: [0,1,2,4,5] }
];

function randomId() {
  return Math.random().toString(36).slice(2, 9);
}

var STATUS_CYCLE = { unpaid: "paid", paid: "skip", skip: "unpaid" };

var STATUS = {
  paid:   { label: "已付", color: "#6b8f71", bg: "rgba(107,143,113,0.12)", border: "rgba(107,143,113,0.35)" },
  unpaid: { label: "未付", color: "#a07850", bg: "rgba(160,120,80,0.12)", border: "rgba(160,120,80,0.35)" },
  skip:   { label: "不點", color: "#5a5a72", bg: "rgba(90,90,114,0.12)", border: "rgba(90,90,114,0.35)" },
  absent: { label: "休假", color: "#3a3a44", bg: "rgba(58,58,68,0.12)", border: "rgba(58,58,68,0.4)" }
};

function pad2(n) {
  n = String(n);
  if (n.length < 2) { n = "0" + n; }
  return n;
}

function toISODate(d) {
  var y = d.getFullYear();
  var m = pad2(d.getMonth() + 1);
  var day = pad2(d.getDate());
  return y + "-" + m + "-" + day;
}

function dayIdxFromDate(d) {
  var wd = d.getDay();
  return wd === 0 ? 6 : wd - 1;
}

function App() {
  var peopleState = React.useState(function () {
    try {
      var s = localStorage.getItem("nxp_people");
      return s ? JSON.parse(s) : defaultPeople;
    } catch (e) {
      return defaultPeople;
    }
  });
  var people = peopleState[0];
  var setPeople = peopleState[1];

  var roundsState = React.useState(function () {
    try {
      var s = localStorage.getItem("nxp_rounds");
      return s ? JSON.parse(s) : [];
    } catch (e) {
      return [];
    }
  });
  var rounds = roundsState[0];
  var setRounds = roundsState[1];

  var viewState = React.useState("home");
  var view = viewState[0];
  var setView = viewState[1];

  var activeRoundState = React.useState(null);
  var activeRound = activeRoundState[0];
  var setActiveRound = activeRoundState[1];

  var isEditingState = React.useState(false);
  var isEditing = isEditingState[0];
  var setIsEditing = isEditingState[1];

  var editPersonState = React.useState(null);
  var editPerson = editPersonState[0];
  var setEditPerson = editPersonState[1];

  var newNameState = React.useState("");
  var newName = newNameState[0];
  var setNewName = newNameState[1];

  var newWorkDaysState = React.useState([0,1,2,3,4]);
  var newWorkDays = newWorkDaysState[0];
  var setNewWorkDays = newWorkDaysState[1];

  var toastState = React.useState("");
  var toast = toastState[0];
  var setToast = toastState[1];

  var showAddPersonState = React.useState(false);
  var showAddPerson = showAddPersonState[0];
  var setShowAddPerson = showAddPersonState[1];

  var debtPersonState = React.useState(null);
  var debtPerson = debtPersonState[0];
  var setDebtPerson = debtPersonState[1];

  var imgZoomState = React.useState(null);
  var imgZoom = imgZoomState[0];
  var setImgZoom = imgZoomState[1];

  var fileRef = React.useRef();

  React.useEffect(function () {
    try { localStorage.setItem("nxp_people", JSON.stringify(people)); } catch (e) {}
  }, [people]);

  React.useEffect(function () {
    try { localStorage.setItem("nxp_rounds", JSON.stringify(rounds)); } catch (e) {}
  }, [rounds]);

  React.useEffect(function () {
    if (view === "home") return;
    var touchStartX = 0;
    var touchStartY = 0;
    function onTouchStart(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
    function onTouchEnd(e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
      if (dx > 80 && dy < 60 && touchStartX < 40) {
        setView("home");
      }
    }
    window.addEventListener("touchstart", onTouchStart);
    window.addEventListener("touchend", onTouchEnd);
    return function () {
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchend", onTouchEnd);
    };
  }, [view]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(function () { setToast(""); }, 1800);
  }

  function todayIdx() {
    var d = new Date().getDay();
    return d === 0 ? 6 : d - 1;
  }

  function makeRound(type) {
    var now = new Date();
    var today = todayIdx();
    var present = people.filter(function (p) { return p.workDays.indexOf(today) !== -1; });
    var orders = {};
    var payments = {};
    people.forEach(function (p) {
      orders[p.id] = { item: "", amount: "" };
      var isPresent = false;
      for (var i = 0; i < present.length; i++) {
        if (present[i].id === p.id) { isPresent = true; break; }
      }
      payments[p.id] = isPresent ? "unpaid" : "absent";
    });
    return {
      id: randomId(),
      type: type,
      isoDate: toISODate(now),
      date: now.toLocaleDateString("zh-TW"),
      dayLabel: "週" + DAYS[today],
      image: null,
      shopName: "",
      orders: orders,
      payments: payments
    };
  }

  function updateRoundDate(isoStr) {
    if (!isoStr) return;
    var parts = isoStr.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    var d = Number(parts[2]);
    var dateObj = new Date(y, m - 1, d);
    var idx = dayIdxFromDate(dateObj);
    setActiveRound(function (r) {
      var copy = Object.assign({}, r);
      copy.isoDate = isoStr;
      copy.date = dateObj.toLocaleDateString("zh-TW");
      copy.dayLabel = "週" + DAYS[idx];
      return copy;
    });
  }

  function startRound(type) {
    setActiveRound(makeRound(type));
    setIsEditing(false);
    setView("newRound");
  }

  function openRound(round) {
    setActiveRound(round);
    setView("roundDetail");
  }

  function editRound(round) {
    var orders = Object.assign({}, round.orders);
    var payments = Object.assign({}, round.payments);
    people.forEach(function (p) {
      if (!orders[p.id]) orders[p.id] = { item: "", amount: "" };
      if (!payments[p.id]) payments[p.id] = "absent";
    });
    var isoDate = round.isoDate;
    if (!isoDate && round.date) {
      var parts = round.date.split("/");
      if (parts.length === 3) {
        isoDate = toISODate(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
      }
    }
    var next = Object.assign({}, round, { orders: orders, payments: payments, isoDate: isoDate });
    setActiveRound(next);
    setIsEditing(true);
    setView("newRound");
  }

  function handleImageUpload(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        var maxW = 800;
        var scale = img.width > maxW ? maxW / img.width : 1;
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        setActiveRound(function (r) {
          var copy = Object.assign({}, r);
          copy.image = dataUrl;
          return copy;
        });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function updateOrder(pid, field, val) {
    setActiveRound(function (r) {
      var orders = Object.assign({}, r.orders);
      var entry = Object.assign({}, orders[pid]);
      entry[field] = val;
      orders[pid] = entry;
      return Object.assign({}, r, { orders: orders });
    });
  }

  function cycleStatus(pid) {
    setActiveRound(function (r) {
      var cur = r.payments[pid];
      if (cur === "absent") return r;
      var payments = Object.assign({}, r.payments);
      payments[pid] = STATUS_CYCLE[cur] || "unpaid";
      return Object.assign({}, r, { payments: payments });
    });
  }

  function toggleAbsent(pid) {
    setActiveRound(function (r) {
      var cur = r.payments[pid];
      var payments = Object.assign({}, r.payments);
      payments[pid] = cur === "absent" ? "unpaid" : "absent";
      return Object.assign({}, r, { payments: payments });
    });
  }

  function saveRound() {
    var round = activeRound;
    if (isEditing) {
      setRounds(function (rs) {
        return rs.map(function (x) { return x.id === round.id ? round : x; });
      });
      showToast("已更新");
      setView("roundDetail");
    } else {
      setRounds(function (rs) { return [round].concat(rs); });
      showToast("已儲存");
      setView("home");
    }
    setIsEditing(false);
  }

  function cycleRoundPayment(pid) {
    setActiveRound(function (r) {
      var cur = r.payments[pid];
      if (cur === "absent") return r;
      var payments = Object.assign({}, r.payments);
      payments[pid] = STATUS_CYCLE[cur] || "unpaid";
      var updated = Object.assign({}, r, { payments: payments });
      setRounds(function (rs) {
        return rs.map(function (x) { return x.id === updated.id ? updated : x; });
      });
      return updated;
    });
  }

  function deleteRound(id) {
    setRounds(function (rs) { return rs.filter(function (r) { return r.id !== id; }); });
    setView("home");
    setActiveRound(null);
    showToast("已刪除");
  }

  function markPersonPaid(personId, roundId) {
    setRounds(function (rs) {
      return rs.map(function (r) {
        if (roundId && r.id !== roundId) return r;
        if (r.payments[personId] !== "unpaid") return r;
        var payments = Object.assign({}, r.payments);
        payments[personId] = "paid";
        return Object.assign({}, r, { payments: payments });
      });
    });
  }

  function markAllPaidForPerson(personId) {
    setRounds(function (rs) {
      return rs.map(function (r) {
        if (r.payments[personId] !== "unpaid") return r;
        var payments = Object.assign({}, r.payments);
        payments[personId] = "paid";
        return Object.assign({}, r, { payments: payments });
      });
    });
    showToast("已全部標記已付");
    setDebtPerson(null);
  }

  function addPerson() {
    if (!newName.trim()) return;
    setPeople(function (ps) {
      return ps.concat([{ id: Date.now(), name: newName.trim(), workDays: newWorkDays }]);
    });
    setNewName("");
    setNewWorkDays([0,1,2,3,4]);
    setShowAddPerson(false);
    showToast("已新增");
  }

  function savePerson() {
    setPeople(function (ps) {
      return ps.map(function (p) { return p.id === editPerson.id ? editPerson : p; });
    });
    setEditPerson(null);
    showToast("已更新");
  }

  function deletePerson(id) {
    setPeople(function (ps) { return ps.filter(function (p) { return p.id !== id; }); });
    setEditPerson(null);
    showToast("已刪除");
  }

  var unpaidCounts = {};
  people.forEach(function (p) { unpaidCounts[p.id] = 0; });
  rounds.forEach(function (r) {
    Object.keys(r.payments).forEach(function (pid) {
      if (r.payments[pid] === "unpaid") {
        unpaidCounts[pid] = (unpaidCounts[pid] || 0) + 1;
      }
    });
  });

  function roundTotal(round) {
    if (!round.orders) return 0;
    var sum = 0;
    Object.keys(round.orders).forEach(function (pid) {
      var s = round.payments[pid];
      if (s === "absent" || s === "skip") return;
      var amt = parseFloat(round.orders[pid].amount);
      if (!isNaN(amt)) sum += amt;
    });
    return sum;
  }

  function typeEmoji(t) { return t === "drink" ? "\u{1F9CB}" : "\u{1F371}"; }
  function typeLabel(t) { return t === "drink" ? "飲料" : "食物"; }
  function typeShopPlaceholder(t) { return t === "drink" ? "例：50嵐、茶湯會" : "例：便當店、麥當勞"; }

  var unpaidPeople = people.filter(function (p) { return unpaidCounts[p.id] > 0; });

  return React.createElement(
    "div",
    { style: { position: "fixed", inset: 0, background: "var(--bg)" } },

    toast ? React.createElement("div", {
      style: { position: "fixed", top: 24, left: "50%", transform: "translateX(-50%)", background: "var(--bg3)", border: "1px solid var(--border2)", padding: "9px 22px", borderRadius: 999, fontSize: 13, zIndex: 999, whiteSpace: "nowrap", color: "var(--text)", letterSpacing: "0.05em" }
    }, toast) : null,

    imgZoom ? React.createElement("div", {
      onClick: function () { setImgZoom(null); },
      style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.95)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }
    }, React.createElement("img", { src: imgZoom, style: { maxWidth: "100%", maxHeight: "90vh", borderRadius: 8 } })) : null,

    view === "home" ? React.createElement(React.Fragment, null,
      React.createElement("div", { className: "header" },
        React.createElement("h1", { style: { fontSize: 28, lineHeight: 1.2, letterSpacing: "0.03em", fontFamily: "'Zen Maru Gothic', sans-serif" } },
          React.createElement("span", { style: { color: "#F5A800", fontWeight: 700, fontSize: 30 } }, "N"),
          React.createElement("span", { style: { color: "#00A6D6", fontWeight: 700, fontSize: 30 } }, "X"),
          React.createElement("span", { style: { color: "#7AB800", fontWeight: 700, fontSize: 30 } }, "P"),
          React.createElement("span", { style: { color: "var(--text)", fontWeight: 300, letterSpacing: "0.06em" } }, " 中班吃吃喝喝")
        )
      ),
      React.createElement("div", { className: "scroll-area" },
        React.createElement("div", { className: "page" },
          unpaidPeople.length > 0 ? React.createElement("div", { className: "card", style: { padding: "14px 16px", marginBottom: 20 } },
            React.createElement("div", { className: "label" }, "待收款"),
            React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
              unpaidPeople.map(function (p) {
                return React.createElement("div", {
                  key: p.id,
                  onClick: function () { setDebtPerson(p.id); },
                  style: { background: "rgba(160,120,80,0.1)", border: "1px solid rgba(160,120,80,0.25)", borderRadius: 6, padding: "3px 10px", fontSize: 13, color: "#a07850", cursor: "pointer" }
                }, p.name + " ", React.createElement("span", { style: { opacity: 0.7 } }, "\u00d7" + unpaidCounts[p.id]));
              })
            )
          ) : null,
          React.createElement("div", { style: { display: "flex", gap: 10, marginBottom: 28 } },
            React.createElement("button", {
              onClick: function () { startRound("drink"); },
              style: { flex: 1, padding: "15px 0", background: "var(--bg3)", border: "1px solid rgba(124,158,166,0.3)", color: "#7c9ea6", fontSize: 14, fontWeight: 400, borderRadius: 10, letterSpacing: "0.05em" }
            }, "\u{1F9CB} 飲料單"),
            React.createElement("button", {
              onClick: function () { startRound("food"); },
              style: { flex: 1, padding: "15px 0", background: "var(--bg3)", border: "1px solid rgba(138,143,168,0.3)", color: "#8a8fa8", fontSize: 14, fontWeight: 400, borderRadius: 10, letterSpacing: "0.05em" }
            }, "\u{1F371} 食物單")
          ),
          React.createElement("div", { className: "label", style: { marginBottom: 14 } }, "紀錄"),
          rounds.length === 0 ? React.createElement("div", { style: { textAlign: "center", color: "var(--text3)", fontSize: 13, padding: "40px 0", letterSpacing: "0.05em" } }, "尚無紀錄") : null,
          rounds.map(function (r) {
            var unpaid = 0, paid = 0;
            Object.keys(r.payments).forEach(function (k) {
              if (r.payments[k] === "unpaid") unpaid++;
              if (r.payments[k] === "paid") paid++;
            });
            var total = roundTotal(r);
            var accentColor = r.type === "drink" ? "#7c9ea6" : "#8a8fa8";
            return React.createElement("div", {
              key: r.id,
              className: "card",
              onClick: function () { openRound(r); },
              style: { padding: "14px 16px", marginBottom: 8, cursor: "pointer", display: "flex", gap: 12, alignItems: "center" }
            },
              r.image ? React.createElement("img", {
                src: r.image,
                onClick: function (e) { e.stopPropagation(); setImgZoom(r.image); },
                style: { width: 46, height: 46, objectFit: "cover", borderRadius: 8, flexShrink: 0, opacity: 0.85 }
              }) : React.createElement("div", {
                style: { width: 46, height: 46, borderRadius: 8, background: "var(--bg2)", border: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }
              }, typeEmoji(r.type)),
              React.createElement("div", { style: { flex: 1, minWidth: 0 } },
                React.createElement("div", { style: { fontSize: 14, fontWeight: 400, color: "var(--text)", display: "flex", alignItems: "center", gap: 8 } },
                  React.createElement("span", { style: { fontSize: 10, color: accentColor, letterSpacing: "0.1em", textTransform: "uppercase", flexShrink: 0 } }, typeLabel(r.type)),
                  React.createElement("span", { style: { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, r.shopName || r.date)
                ),
                React.createElement("div", { style: { fontSize: 11, color: "var(--text2)", marginTop: 4 } },
                  r.shopName ? React.createElement("span", { style: { marginRight: 8, color: "var(--text3)" } }, r.date + " " + r.dayLabel) : React.createElement("span", { style: { marginRight: 8, color: "var(--text3)" } }, r.dayLabel),
                  "已付 " + paid + " · 未付 ",
                  React.createElement("span", { style: { color: "#a07850" } }, unpaid),
                  total > 0 ? React.createElement("span", { style: { color: "var(--text2)", marginLeft: 8 } }, "$ " + total) : null
                )
              ),
              React.createElement("div", { style: { fontSize: 16, color: "var(--text3)" } }, "\u203a")
            );
          })
        )
      )
    ) : null,

    view === "newRound" && activeRound ? React.createElement(React.Fragment, null,
      React.createElement("div", { className: "header" },
        React.createElement("button", {
          onClick: function () { setView(isEditing ? "roundDetail" : "home"); },
          style: { background: "var(--bg3)", border: "1px solid var(--border)", borderRadius: 999, width: 34, height: 34, color: "var(--text2)", fontSize: 16, flexShrink: 0 }
        }, "\u2039"),
        React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 11, color: "var(--text3)", letterSpacing: "0.05em" } }, activeRound.date + " " + activeRound.dayLabel),
          React.createElement("h2", { style: { fontSize: 18, fontWeight: 400, color: "var(--text)", letterSpacing: "0.03em" } }, typeEmoji(activeRound.type) + " " + (isEditing ? "編輯" : "") + typeLabel(activeRound.type) + "單")
        )
      ),
